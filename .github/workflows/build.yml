name: build

# Every push and pull request is tested and built, nothing is published.
# A tag like v1.2.3 is a release: the binaries go to a GitHub release and
# the Docker image to Docker Hub.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # The tagging test runs against the real tools when they are present.
      - name: Install ffmpeg and mkvtoolnix
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          version=${GITHUB_SHA::7}
          [ "$GITHUB_REF_TYPE" = tag ] && version=$GITHUB_REF_NAME
          name=mediakeeper-${GOOS}-${GOARCH}${GOARM:+v$GOARM}
          exe=mediakeeper; [ "$GOOS" = windows ] && exe=mediakeeper.exe
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$exe" .
          if [ "$GOOS" = windows ]; then
            zip "dist/$name.zip" "$exe"
          else
            tar -czf "dist/$name.tar.gz" "$exe"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mediakeeper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # The image goes to Docker Hub as <DOCKERHUB_USERNAME>/mediakeeper. It needs,
  # in the repository settings (Secrets and variables -> Actions):
  #   variable DOCKERHUB_USERNAME - the Docker Hub account or organization
  #   secret   DOCKERHUB_TOKEN    - an access token with Read & Write scope
  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # The fallback name only lets unpublished builds run in a
          # repository where Docker Hub is not set up.
          images: ${{ vars.DOCKERHUB_USERNAME || 'local' }}/mediakeeper
          # v1.2.3 -> 1.2.3, 1.2 and latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Only a v* tag is published; other builds check that the image builds.
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
